name: Menu extension validation sources
on:
  push:
    branches: ["feature/2610"]
    paths: [".github/workflows/menu-devkit.yml"]
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Bundle pinned source without Git metadata or credentials
        run: |
          tar --exclude=.git --exclude='*/.git' -czf /tmp/kshim-menu-devkit.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: kshim-menu-devkit
          path: /tmp/kshim-menu-devkit.tar.gz
          retention-days: 1
