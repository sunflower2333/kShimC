name: Verify theme-removal source transfer
on:
  push:
    branches: [feature/2610-design-language]
    paths: [.github/workflows/oneui-removal-transfer.yml]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a154e1af2eb65514b15b8f30bb067fb934b6fcad
          persist-credentials: false
      - name: Verify source edits and upload immutable blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, subprocess, urllib.request, zlib
          from pathlib import Path, PurePosixPath
          packed = ''
          raw = zlib.decompress(base64.b64decode(packed, validate=True))
          assert hashlib.sha256(raw).hexdigest() == 'fc3f4ad57ce81ac9c82c74aa31a9f48f045927e1661cdd1a9ab533e774c7fb29'
          changes = json.loads(raw)
          assert len(changes) == 21
          assert subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip() == 'a154e1af2eb65514b15b8f30bb067fb934b6fcad'
          def blob(raw):
              return hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          prepared = []
          for name, change in changes.items():
              path = PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts
              assert name.startswith(('src/','tests/','tools/','docs/')) or name == '.github/workflows/menu-styles.yml'
              file = Path(name)
              assert not file.is_symlink()
              original = file.read_bytes() if file.exists() else b''
              assert (blob(original) if file.exists() else None) == change['old'], name
              mode = subprocess.check_output(['git','ls-tree','HEAD','--',name], text=True).split()
              mode = mode[0] if mode else '100644'
              entry = dict(path=name, mode=mode, type='blob', sha=change['new'])
              if change['new'] is None:
                  prepared.append((entry,None))
                  continue
              text = original.decode('utf-8')
              limit = len(text)
              for start,end,value in reversed(change['edits']):
                  assert 0 <= start <= end <= limit
                  text = text[:start]+value+text[end:]
                  limit = start
              assert blob(text.encode('utf-8')) == change['new'], name
              prepared.append((entry,text))
          # Only immutable blob uploads. Branches, commits, trees and workflow
          # paths are never updated by this temporary transport job.
          for entry,text in prepared:
              if text is None: continue
              request = urllib.request.Request(
                  'https://api.github.com/repos/sunflower2333/kShimC/git/blobs',
                  data=json.dumps(dict(content=text,encoding='utf-8')).encode(),
                  method='POST', headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                  'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(request,timeout=30) as response:
                  result = json.load(response)
              assert result['sha'] == entry['sha'], entry['path']
          out=Path('/tmp/verified-removal');out.mkdir()
          (out/'tree-elements.json').write_text(json.dumps([e for e,t in prepared],indent=2)+'\n')
          print('Verified all 21 edits against pinned source and uploaded exact immutable blobs; no ref changed.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: verified-theme-removal-blobs
          path: /tmp/verified-removal/
          retention-days: 2
          if-no-files-found: error
