name: Boot menu styles

on:
  push:
    branches: ["feature/2610"]
    paths:
      - "src/ui/**"
      - "src/include/**"
      - "src/Kconfig"
      - "tests/**"
      - "tools/test_menu_styles.py"
      - ".github/workflows/menu-styles.yml"
  pull_request:
    paths:
      - "src/ui/**"
      - "src/include/**"
      - "src/Kconfig"
      - "tests/**"
      - "tools/test_menu_styles.py"
      - ".github/workflows/menu-styles.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preset-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Kconfig parser
        run: |
          python3 -m venv /tmp/kshim-style-venv
          /tmp/kshim-style-venv/bin/pip install kconfiglib==14.1.0
      - name: GCC, Clang and real Kconfig choices
        run: |
          /tmp/kshim-style-venv/bin/python tools/test_menu_styles.py --cc gcc --kconfig
          /tmp/kshim-style-venv/bin/python tools/test_menu_styles.py --cc clang
  lvgl-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        style: [FLAT, CLASSIC, CARDS, TERMINAL, MINIMAL, HIGH_CONTRAST]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install host build dependencies
        run: sudo apt-get update && sudo apt-get install -y device-tree-compiler ninja-build
      - name: Configure selected menu style
        run: cmake -S tests -B build-menu -G Ninja -DKSHIM_TEST_MENU_STYLE=${{ matrix.style }}
      - name: Build real LVGL regression tests
        run: cmake --build build-menu --parallel 2 --target lvgl_test lvgl_hdk_test menu_style_render_test
      - name: Test styles, input safety, CJK and framebuffer formats
        run: ctest --test-dir build-menu --output-on-failure -R '^(lvgl_test|lvgl_hdk_test|menu_style_render_test)$'
