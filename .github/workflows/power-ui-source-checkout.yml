name: Power UI pinned checkout
on:
  push:
    branches: [feature/2610]
    paths: [.github/workflows/power-ui-source-checkout.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6527d063c03b3e31a55b5f77b77f0fe3a42b1606
          submodules: recursive
          persist-credentials: false
      - name: Export source and exact git identities
        run: |
          mkdir -p /tmp/power-ui-source
          git rev-parse HEAD > /tmp/power-ui-source/commit.txt
          git ls-tree -r HEAD > /tmp/power-ui-source/tree.txt
          git submodule status --recursive > /tmp/power-ui-source/submodules.txt
          git bundle create /tmp/power-ui-source/repo.bundle HEAD
          git -C lib/CrDK bundle create /tmp/power-ui-source/crdk.bundle HEAD
          tar --exclude=.git --exclude=lib/picolibc --exclude=third_party/lvgl/demos --exclude=third_party/lvgl/examples --exclude=third_party/lvgl/tests --exclude=third_party/lvgl/docs --exclude=third_party/lvgl/scripts -czf /tmp/power-ui-source/source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: power-ui-pinned-checkout
          path: /tmp/power-ui-source/
          retention-days: 3
          if-no-files-found: error
